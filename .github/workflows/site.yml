name: Website

# Publishes site/ to GitHub Pages, with the screenshots and demo from docs/. Runs when the site changes on main,
# by hand, or after a shared animation is added (share-animation.yml calls it, because a push made by a workflow
# doesn't start other workflows).
on:
  push:
    branches: [main]
    paths: [site/**, docs/*.png, docs/*.gif, .github/workflows/site.yml]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always main, so a run started by an approved animation publishes the commit that added it.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Put the site together
        run: |
          mkdir -p _site/media
          cp -r site/. _site/
          cp docs/demo.gif docs/gallery.png docs/screenshot.png docs/animations.png _site/media/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
