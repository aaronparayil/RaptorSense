name: Shared animations

# Puts animations from the "Share an animation" issue form on the website by itself, with nobody having to approve
# them: when such an issue is opened or edited, scripts/site/add_animation.py checks it. One that passes is added,
# the website tests run, it goes on main, the sharer gets the link and the issue closes. One that fails gets a reply
# saying what to fix, and editing the issue checks it again. One whose text needs a person (a held word, a link, a
# brand-new account) waits with the label "waiting for review".
#
# The owner can always step in with labels: "approved animation" puts up a held one (the file checks still apply),
# and "remove animation" takes an issue's animation off the website.
#
# The issue's text is only ever handed over through environment variables, never written into a command.
on:
  issues:
    types: [opened, edited, labeled]

permissions: {}

concurrency:
  group: share-animation
  cancel-in-progress: false

jobs:
  handle:
    if: >-
      (
        (github.event.action == 'opened' || github.event.action == 'edited')
        && github.event.issue.state == 'open'
        && contains(github.event.issue.labels.*.name, 'animation')
        && !contains(github.event.issue.labels.*.name, 'on the website')
      ) || (
        github.event.action == 'labeled'
        && github.event.sender.login == github.repository_owner
        && (github.event.label.name == 'approved animation' || github.event.label.name == 'remove animation')
      )
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    outputs:
      outcome: ${{ steps.check.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: When the sharer's account was made
        id: account
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: echo "created=$(gh api "users/$LOGIN" -q .created_at)" >> "$GITHUB_OUTPUT"

      - name: Check the animation
        id: check
        env:
          MODE: ${{ github.event.label.name == 'remove animation' && 'remove' || 'add' }}
          OVERRIDE: ${{ github.event.label.name == 'approved animation' && '1' || '0' }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ACCOUNT_CREATED: ${{ steps.account.outputs.created }}
        run: python -I scripts/site/add_animation.py

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.outcome == 'added' || steps.check.outputs.outcome == 'removed'
        with:
          dotnet-version: 10.0.x

      - name: Check the website the way the app reads it
        if: steps.check.outputs.outcome == 'added' || steps.check.outputs.outcome == 'removed'
        run: |
          dotnet build tests/RaptorSense.Tests/RaptorSense.Tests.csproj -c Release -v q
          dotnet run --project tests/RaptorSense.Tests/RaptorSense.Tests.csproj -c Release --no-build -- -class RaptorSense.Tests.SiteTests

      - name: Save the change
        if: steps.check.outputs.outcome == 'added' || steps.check.outputs.outcome == 'removed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/animations
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.check.outputs.outcome }}" = removed ]; then
            git commit -m "Take the animation from issue #$NUMBER off the website"
          else
            git commit -m "Add the animation shared in issue #$NUMBER"
          fi
          git push origin HEAD:main

      - name: Reply
        env:
          OUTCOME: ${{ steps.check.outputs.outcome }}
        run: |
          gh issue comment "$NUMBER" --body-file result.md
          case "$OUTCOME" in
            added)
              gh issue edit "$NUMBER" --add-label "on the website" --remove-label "needs changes,waiting for review,approved animation" || true
              gh issue close "$NUMBER" --reason completed ;;
            removed)
              gh issue edit "$NUMBER" --remove-label "on the website,approved animation" || true ;;
            refused)
              gh issue edit "$NUMBER" --add-label "needs changes" --remove-label "waiting for review,approved animation" || true ;;
            held)
              gh issue edit "$NUMBER" --add-label "waiting for review" --remove-label "needs changes" || true ;;
          esac

      - name: Say what went wrong
        if: failure()
        env:
          OUTCOME: ${{ steps.check.outputs.outcome }}
        run: |
          # The script explains its own outcomes; a failure after it is the website's problem, not the sharer's.
          echo "This animation couldn't be added because of a problem on the website's side, not with your file. It will be looked into." > result.md
          gh issue comment "$NUMBER" --body-file result.md
          gh issue edit "$NUMBER" --add-label "waiting for review" --remove-label "approved animation" || true

  publish:
    needs: handle
    if: needs.handle.outputs.outcome == 'added' || needs.handle.outputs.outcome == 'removed'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
